<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otel Denetim Sistemi</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a2535 0%, #2d4a6e 50%, #1a2535 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .yukleme { text-align: center; color: white; }
    .yukleme-ikon { font-size: 64px; margin-bottom: 20px; animation: sallan 1.2s ease-in-out infinite; }
    .yukleme-baslik { font-size: 22px; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
    .yukleme-alt { font-size: 13px; opacity: 0.5; margin-bottom: 32px; }
    .bar-bg { width: 200px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; margin: 0 auto; }
    .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #60a5fa); border-radius: 4px; animation: doldur 1.5s ease forwards; }
    @keyframes sallan { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes doldur { to { width: 100%; } }
  </style>
</head>
<body>
  <div class="yukleme">
    <div class="yukleme-ikon">🏨</div>
    <div class="yukleme-baslik">Otel Denetim Sistemi</div>
    <div class="yukleme-alt">Yükleniyor...</div>
    <div class="bar-bg"><div class="bar"></div></div>
  </div>
  <script>
    setTimeout(() => { window.location.replace('denetim-sistemi.html'); }, 1500);
  </script>
</body>
</html>
